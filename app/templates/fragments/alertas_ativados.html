{# Fragment: alertas atingidos #}
{% if atingidos %}
<h6 class="text-success mb-3"><i class="fa-solid fa-check-circle me-1"></i> Alertas Ativados</h6>
{% for a in atingidos %}
<div class="alerta-card" style="border-color: var(--success-color);">
    <div>
        <span class="alerta-produto text-success">{{ a.produto }}</span>
        <span class="ms-2">
            Preço atual: <strong class="text-success">{{ "R$ %.2f"|format(a.preco_atual) }}</strong>
            {% if a.condicao == "menor" %}≤{% else %}≥{% endif %}
            <span class="alerta-preco">{{ "R$ %.2f"|format(a.preco_alvo) }}</span>
        </span>
    </div>
    <span class="badge bg-success"><i class="fa-solid fa-check me-1"></i>Ativado</span>
</div>
{% endfor %}
{% endif %}
