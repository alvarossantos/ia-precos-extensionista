{# Fragment: histórico de buscas #}
{% if not buscas %}
<div class="text-center text-secondary py-4">
    <i class="fa-solid fa-inbox fa-3x mb-3 opacity-25"></i>
    <p>Nenhuma busca registrada ainda</p>
</div>
{% else %}
{% for b in buscas %}
<div class="historico-item">
    <div>
        <span class="text-white fw-medium">{{ b.produto }}</span>
        <span class="badge bg-secondary ms-2">{{ b.fonte|default("multi", true) }}</span>
    </div>
    <small class="text-secondary">{{ b.data }}</small>
</div>
{% endfor %}
{% endif %}
